name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test step
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                       # reuse downloaded packages between runs
      - run: pip install flake8
      - run: flake8 tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                     # one failing version doesn't cancel the others
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # 3 parallel copies of this job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}   # matrix context
          cache: pip
      - run: pip install -r requirements.txt

      - name: Show contexts
        run: |
          echo "event:  ${{ github.event_name }}"
          echo "branch: ${{ github.ref_name }}"
          echo "actor:  ${{ github.actor }}"
          echo "commit: ${{ github.sha }}"
          echo "os:     ${{ runner.os }}"
          echo "python: ${{ matrix.python-version }}"
          echo "model:  ${{ vars.MODEL_NAME }}"

      - name: Run tests
        id: pytest
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: pytest --junitxml=report.xml  # also writes a test report file

      - name: Save test report
        if: always()                       # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}   # names must be unique
          path: report.xml
          if-no-files-found: ignore

  build:
    needs: test                            # only builds if ALL matrix tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package model files
        run: |
          mkdir dist
          cp model.pkl scaler.pkl movies.csv movies_features.csv dist/
          echo "commit: ${{ github.sha }}" > dist/BUILD_INFO.txt
          echo "built:  $(date -u)" >> dist/BUILD_INFO.txt

      - name: Save bundle
        uses: actions/upload-artifact@v4
        with:
          name: recommender-bundle
          path: dist/

  summary:
    needs: [lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint:  ${{ needs.lint.result }}"
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"